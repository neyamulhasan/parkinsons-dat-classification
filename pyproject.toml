[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parkinsons-dat-classification"
version = "0.1.0"
description = "Competition-compliant framework for the DrivenData DaT Parkinson's Challenge"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6.0.2",
  "numpy>=1.26",
  "nibabel>=5.3",
  "scikit-learn>=1.5",
  "torch>=2.0.0",
  "torchvision>=0.15.0",
  "monai>=1.3.0",
  "tensorboard>=2.15.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
