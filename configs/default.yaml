project:
  name: parkinsons-dat-classification

paths:
  data_root: data
  raw_data: data/raw
  processed_data: data/processed
  smoke_test: data/smoke_test
  outputs: outputs
  logs: logs

runtime:
  seed: 42
  num_workers: 4

training:
  validation_fraction: 0.2
  batch_size: 8
  random_state: 42

baseline:
  max_iter: 1000
  class_weight: balanced
  histogram_bins: 16

artifacts:
  checkpoint_dir: outputs/checkpoints
  report_dir: outputs/reports

inference:
  submission_filename: submission.csv
